apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-project
  namespace: sample
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodejs-project
  template:
    metadata:
      labels:
        app: nodejs-project
    spec:
      containers:
        - name: nodejs-project
          image: <acr-host/<acr-repo>:<tag>
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "dev"
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
            limits:
              memory: "512Mi"
              cpu: "1"