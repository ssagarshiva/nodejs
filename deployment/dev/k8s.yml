apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-project
  labels:
    app: nodejs-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodejs-project
  template:
    metadata:
      labels:
        app: nodejs-project
    spec:
      containers:
        - name: nodejs-project
          image: <acr-host/<acr-repo>:<tag>
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "dev"
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
            limits:
              memory: "512Mi"
              cpu: "1"

---

apiVersion: v1
kind: Service
metadata:
  name: nodejs-project
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  ports:
   - portocol: TCP
     port: 3000
     targetPort: 3000